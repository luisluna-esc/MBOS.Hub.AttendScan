# /etc/nginx/sites-available/attendscan.conf  (enlace en sites-enabled)
# Entrada pública de AttendScan. HTTPS es OBLIGATORIO: sin él el celular no deja usar la cámara.
# El certificado lo crea certbot (ver DEPLOY.md, paso 5), que además agrega aquí el bloque 443.
server {
    listen 80;
    server_name attendscan.iasdmbos.cloud;

    # Excel de la lista de personas.
    client_max_body_size 6m;

    location / {
        proxy_pass http://127.0.0.1:5131;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
